services:
  - type: web
    name: cleansight-ai-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: static
    name: cleansight-ai-frontend
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cleansight-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
